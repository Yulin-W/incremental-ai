<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Incremental AI - An interactive educational idle web game tracing the history of Artificial Intelligence from antiquity to frontier autonomous agents.">
  <title>Incremental AI — The History of Artificial Intelligence</title>
  
  <!-- Modern Typography Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">

  <!-- Core Stylesheet -->
  <link rel="stylesheet" href="styles/style.css">
</head>
<body class="theme-era-1">

  <!-- Top Application Header -->
  <header class="app-header">
    <div class="header-container">
      <div class="brand-section">
        <div class="brand-logo">🧠</div>
        <div>
          <div style="display:flex; align-items:center; gap:0.5rem;">
            <h1 class="brand-title">Incremental AI</h1>
            <span class="version-tag"></span>
          </div>
          <p class="brand-subtitle">The History of Artificial Intelligence</p>
        </div>
      </div>

      <!-- Current Era Progress Pill with Advance Indicator -->
      <div class="era-status-badge" title="Current Historical Paradigm & Era Progression">
        <span id="era-pill-number" class="era-pill-number">Era 1</span>
        <div class="era-badge-info">
          <div class="era-badge-top-row">
            <span id="era-pill-name" class="era-pill-name">Antiquity & Mechanical Automata</span>
            <span id="era-pill-dates" class="era-pill-dates">Prehistory – 1500s</span>
          </div>
          <div class="era-progress-row">
            <div class="era-progress-bar-bg" title="Historical milestone discoveries progress toward next Era">
              <div id="era-progress-bar-fill" class="era-progress-bar-fill" style="width: 0%;"></div>
            </div>
            <span id="era-progress-text" class="era-progress-text">0 / 4 Milestones</span>
          </div>
        </div>
      </div>

      <!-- Resource Economy Counter -->
      <div class="resource-stats">
        <div class="stat-group">
          <span class="stat-label">💡 Insights</span>
          <span id="stat-insights" class="stat-value-insights">0</span>
        </div>
        <div class="stat-group">
          <span class="stat-label">per second</span>
          <span id="stat-rate" class="stat-value-rate">+0.0 / s</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Mobile Viewport Navigation Tab Bar -->
  <nav class="mobile-tab-bar" aria-label="Mobile Navigation">
    <button class="btn-tab active" data-tab="production">⚡ Production</button>
    <button class="btn-tab" data-tab="timeline">⏳ Timeline</button>
    <button class="btn-tab" data-tab="codex">📖 Codex</button>
  </nav>

  <!-- Main 3-Column Educational Interface -->
  <main class="app-main">

    <!-- LEFT PANEL: Production & Research Automation -->
    <aside id="panel-production" class="panel-container active-mobile-panel" aria-label="Production Hub">
      <div class="panel-header">
        <h2 class="panel-title"><span>⚡</span> Production</h2>
      </div>
      <!-- Persistent Action & Controls Header -->
      <div class="production-sticky-header">
        <!-- Manual Thinking Hero -->
        <div class="contemplate-hero">
          <button id="btn-contemplate" class="btn-contemplate" aria-label="Think">
            <span>💡</span>
            <span>Think</span>
          </button>
          <span id="click-gain-badge" class="click-gain-badge">+1.0 / click</span>
        </div>

        <!-- Bulk Purchase Control -->
        <div class="bulk-buy-bar">
          <span class="bulk-label">Buy:</span>
          <div class="bulk-buttons">
            <button class="btn-bulk active" data-mode="1">x1</button>
            <button class="btn-bulk" data-mode="10">x10</button>
            <button class="btn-bulk" data-mode="max">MAX</button>
          </div>
        </div>
      </div>

      <div class="panel-content">
        <!-- Dynamic Generators List -->
        <div id="generator-list" class="generator-list">
          <!-- Populated dynamically by ui.js -->
        </div>
      </div>
    </aside>

    <!-- CENTER PANEL: Historical Paradigm Timeline -->
    <section id="panel-timeline" class="panel-container" aria-label="Timeline Progression">
      <div class="panel-header">
        <h2 class="panel-title"><span>⏳</span> Timeline</h2>
      </div>
      <div class="panel-content">
        <!-- Dynamic Milestones Grid -->
        <div id="milestone-grid" class="milestone-grid">
          <!-- Populated dynamically by ui.js -->
        </div>
      </div>
    </section>

    <!-- RIGHT PANEL: The Knowledge Codex -->
    <aside id="panel-codex" class="panel-container" aria-label="Knowledge Codex">
      <div class="panel-header">
        <h2 class="panel-title"><span>📖</span> Knowledge Codex</h2>
      </div>
      <div class="panel-content">
        <div id="codex-container">
          <!-- Populated dynamically by ui.js -->
        </div>
      </div>
    </aside>

  </main>

  <!-- Floating Toast Notifications -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- Vanilla Application Modules -->
  <script type="module" src="src/ui.js"></script>
</body>
</html>
